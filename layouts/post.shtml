<extend template="base.shtml">
<head id="head">
</head>
<main id="main">
	<article>
		<p><a href="$page.parentSection().link()">← Back</a></p>
		<p class="post-date" :text="$page.date.format('January 02, 2006')"></p>
		<div class="post-content" :html="$page.content()"></div>
		<div id="prev-next">
			<div :if="$page.prevPage?()">
				<a href="$if.link()">← <span :text="$if.title"></span></a>
			</div>
			<div :if="$page.nextPage?()">
				<a href="$if.link()"><span :text="$if.title"></span> →</a>
			</div>
		</div>
	</article>
</main>
